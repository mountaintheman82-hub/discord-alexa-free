name: Discord to Alexa

on:
  schedule:
    # Every 5 minutes, offset from the start of the hour to reduce scheduling delays.
    - cron: '2-59/5 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: discord-alexa-poller
  cancel-in-progress: false

jobs:
  poll-discord:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Check for messages and notify Alexa
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          DISCORD_CHANNEL_ID: ${{ secrets.DISCORD_CHANNEL_ID }}
          ALEXA_ACCESS_CODE: ${{ secrets.ALEXA_ACCESS_CODE }}
        run: node index.js

      - name: Save cursor and keep scheduled workflow active
        if: success()
        run: |
          if ! git diff --quiet -- state.json; then
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add state.json
            git commit -m 'Update Discord polling state'
            git push
          fi
